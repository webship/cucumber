name: Cucumber
type: profile
description: 'The Cucumber installer: choose a site template for the Cucumber Automated Functional Acceptance Testing Management system.'
core_version_requirement: ^11.4 || ^12
package: Cucumber

# Use the `distribution` key to skip the installer's profile selection step.
distribution:
  name: Cucumber
  install:
    theme: claro

# The site template installs everything else; the installer itself only needs
# the administration theme it runs in.
themes:
  - claro
