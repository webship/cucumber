name: Cucumber Default
description: A recipe to manage default configs for the Cucumber installation profile.
type: Testing
config:
  actions:
    user.settings:
      simple_config_update:
        register: admin_only
    system.site:
      simple_config_update:
        page.front: '/dashboard/default_dashboard'
    node.settings:
      simple_config_update:
        use_admin_theme: true
    user.role.admin:
      # Granted here, from hook_install(), once every module that defines
      # these permissions is installed. Granting them in the role's own
      # config installed the role before the permissions existed.
      createIfNotExists:
        label: Admin
        is_admin: false
      grantPermissions:
        - 'access content'
        - 'access content overview'
        - 'revert all revisions'
        - 'view all revisions'
        - 'access features page'
        - 'create feature media'
        - 'edit any feature media'
        - 'can view admin_dashboard dashboard'
    user.role.authenticated:
      # The front page and the login redirect for authenticated users are the
      # default dashboard, so every signed-in user must be able to view it.
      grantPermissions:
        - 'can view default_dashboard dashboard'
