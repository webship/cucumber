include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

# Default build: Drupal 11 on PHP 8.5. Drupal 12 and the newest PHP run as
# opt-in variant jobs, allowed to fail, until they become the default.
variables:
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  # The distribution depends on Display Builder (beta), Media Directories (rc) and,
  # through Web Config, Config Update (alpha);
  # drupalci builds its own root project, so our root stability does not apply there.
  MINIMUM_STABILITY_OVERRIDE: "alpha"
  _TARGET_PHP: "8.5"
  OPT_IN_TEST_NEXT_MAJOR: "1"
  OPT_IN_TEST_MAX_PHP: "1"

.composer-base:
  variables:
    # Drupal core's own Yarn 4.9.1 would read the project .yarnrc.yml (Yarn >= 4.14 keys) too.
    YARN_RC_FILENAME: .yarnrc.core.yml
    YARN_NODE_LINKER: node-modules

cspell:
  stage: validate
  image: node:24
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

# Shared setup for the fast lint jobs (eslint, stylelint).
#
# package.json keeps webship-js as its only devDependency, so the linters are
# installed here, for the lint jobs only:
#   1. `dependencies: []`: the lint jobs do NOT need the composer job's build
#      artifact (the full Drupal tree).
#   2. `npm install --no-save --ignore-scripts`: adds the linters without
#      touching package.json or yarn.lock, and skips webship-js's postinstall
#      (no Playwright browsers).
# The paired .eslintignore excludes vendor/, .yarn/, web/ and node_modules/ so
# `eslint .` only lints the profile's own source.
.lint-node:
  image: node:24
  dependencies: []
  before_script:
    - npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
        eslint@8
        eslint-config-airbnb-base@15
        eslint-config-prettier@8
        eslint-plugin-import@2
        eslint-plugin-jquery@1
        eslint-plugin-prettier@4
        eslint-plugin-yml@1
        prettier@2
        stylelint@15
        stylelint-config-standard@33

eslint:
  extends: .lint-node
  stage: validate
  script:
    - npx --no-install eslint .
    - npx --no-install eslint --ext .yml .
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: false

stylelint:
  extends: .lint-node
  stage: validate
  script:
    - npx --no-install stylelint "**/*.css" || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true

# Shared Drupal + Node.js setup for browser tests.
#
# How it works:
#   1. The drupalci `composer` job builds a full Drupal site (the cucumber
#      profile plus its dependencies) and passes its artifact to this job via
#      `needs: [composer]`.
#   2. This job runs inside the drupalci PHP-Apache image (inherited from
#      `.testing-job-base`) which already has PHP, Apache, Drush, and MySQL.
#   3. before_script installs Drupal with the cucumber profile itself, then
#      Node.js + yarn deps + Playwright Chromium. Test jobs only override
#      `script:`.
#   4. The site build creates the accounts of cucumber.js
#      (worldParameters.users) with drush; the suite only logs in.
# ------------------------------------------------------------------------------
.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services. We only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    # composer.json sets bin-dir to bin/, so drush is not under vendor/bin.
    DRUSH_BIN: "bin/drush"
    # The accounts of cucumber.js worldParameters.users. Their passwords are
    # made in before_script, for this throwaway site only.
    DRUPAL_ADMIN_USER: "webmaster"
    DRUPAL_ADMIN_MAIL: "webmaster@example.test"
    CUCUMBER_ADMIN_USER: "admin_user"
    CUCUMBER_ADMIN_MAIL: "admin_user@example.test"
    CUCUMBER_TESTER_USER: "tester_user"
    CUCUMBER_TESTER_MAIL: "tester_user@example.test"
    DRUPAL_AUTHENTICATED_USER: "authenticated_user"
    DRUPAL_AUTHENTICATED_MAIL: "authenticated_user@example.test"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  before_script:
    # Web server.
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # Database.
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # Test account passwords, for this job only.
    - export DRUPAL_ADMIN_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export CUCUMBER_ADMIN_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export CUCUMBER_TESTER_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export DRUPAL_AUTHENTICATED_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    # Drupal site install with the cucumber profile, answering its install
    # tasks: every user role (Admin is always on), all recipes, no demo.
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install cucumber
        --db-url=$SIMPLETEST_DB
        --account-name="$DRUPAL_ADMIN_USER"
        --account-pass="$DRUPAL_ADMIN_PASS"
        --account-mail="$DRUPAL_ADMIN_MAIL"
        --site-name="Cucumber Test"
        cucumber_user_roles.tester=1
        cucumber_user_roles.developer=1
        cucumber_user_roles.analyst=1
        cucumber_user_roles.coordinator=1
        cucumber_user_roles.designer=1
        cucumber_user_roles.product_owner=1
        -y
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # Test accounts (cucumber.js worldParameters.users): a member of the Admin
    # role, a tester and a member without a role. The suite never creates or
    # deletes an account: the site build does.
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "$CUCUMBER_ADMIN_USER" --mail="$CUCUMBER_ADMIN_MAIL" --password="$CUCUMBER_ADMIN_PASS"
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add admin "$CUCUMBER_ADMIN_USER"
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "$CUCUMBER_TESTER_USER" --mail="$CUCUMBER_TESTER_MAIL" --password="$CUCUMBER_TESTER_PASS"
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT user:role:add tester "$CUCUMBER_TESTER_USER"
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT user:create "$DRUPAL_AUTHENTICATED_USER" --mail="$DRUPAL_AUTHENTICATED_MAIL" --password="$DRUPAL_AUTHENTICATED_PASS"
    # A test runner has no mail server: collect the mails instead of sending
    # them, so the password reset form returns instead of waiting on a mailer.
    - $CI_PROJECT_DIR/$DRUSH_BIN --root=$CI_PROJECT_DIR/$_WEB_ROOT config:set system.mail interface.default test_mail_collector -y
    # Node.js 24.
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # Yarn deps + Playwright Chromium.
    # Force node_modules layout so node_modules/.bin/* is populated.
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js. webship-js's postinstall can clobber it under yarn 4
    # because INIT_CWD may differ from our project root inside the container.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    # Restore cucumber.js if postinstall overwrote it with the init-webship template.
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# webship-js BDD functional tests.
webship-js-test:
  extends: .drupal-node-base
  script:
    - ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  allow_failure: false

# The Drupal 11.4 development branch carries the fix for the Twig 3.30 escape
# TypeError (https://www.drupal.org/i/3625969), which 11.4.6 does not: pages
# rendered by UIkit Admin, the log in page included, fail on 11.4.6. The branch
# has dev stability, below the alpha floor set for the pipeline above, so this
# job lowers the floor to dev.
composer:
  variables:
    DRUPAL_CORE: "11.4.x-dev"
    MINIMUM_STABILITY_OVERRIDE: "dev"

# Drupal 12: let Composer install the contributed modules that do not declare
# ^12 yet.
composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: "autocomplete_deluxe,automatic_updates,coffee,config_filter,config_ignore,config_import_single,config_rewrite,config_split,config_update,config_update_ui,crop,ctools,display_builder,display_builder_entity_view,display_builder_page_layout,display_builder_ui,display_builder_views,drupical,embed,entity_embed,field_group,focal_point,inline_entity_form,media_directories_editor,media_directories_ui,media_remote_audio,media_remote_image,metatag,pathauto,sam,smart_trim,tagify,token_filter,tracker,user_redirect,view_password,views_bulk_edit,views_bulk_operations"
